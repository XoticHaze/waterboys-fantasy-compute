[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waterboys-fantasy-compute"
version = "0.1.0"
description = "Stateless public compute for WaterBoys ESPN fantasy operations"
requires-python = ">=3.11"
dependencies = [
  "espn-api==0.46.0"
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]
