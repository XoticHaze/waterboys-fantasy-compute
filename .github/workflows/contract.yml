name: WaterBoys Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: waterboys-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install
        run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Test
        run: |
          set -euo pipefail
          python -m pytest -q
          node --check cloudflare/waterboys-broker/src/index.js
      - name: Cloudflare dry run
        run: |
          set -euo pipefail
          npx --yes wrangler@4.131.2 deploy             --dry-run             --config cloudflare/waterboys-broker/wrangler.jsonc             --outdir "$RUNNER_TEMP/waterboys-broker-dry-run"
