name: NVIDIA Private Synthetic Role Batch (existing Service Binding)
on:
  push:
    branches: [main]
    paths: ['ops/nvidia_role_batch_trigger.txt']
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cc-shared-nvidia-private-controlled-provider-test
  cancel-in-progress: false
jobs:
  synthetic-roles:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      catalog_ready: ${{ steps.lifecycle.outputs.catalog_ready }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    # Automatic refresh uses only fresh catalog identities and due pairs.
    # A maximum of four two-model batches per daily cycle.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: XoticHaze/research-compute-public-
          ref: abd8fcac5299aaf5308e831db6a1fcfcd5066898
          path: approved-source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Select catalog-only for scheduled and manual refresh
        if: github.event_name != 'push'
        run: printf '%s\n' 'auto' > ops/nvidia_role_batch_trigger.txt
      - name: Validate approved exact benchmark and selector
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C approved-source rev-parse HEAD)" = "abd8fcac5299aaf5308e831db6a1fcfcd5066898"
          (cd approved-source/cloudflare/shared-nvidia-inference && npm test)
          node --check approved-source/cloudflare/shared-nvidia-inference/src/provider_pacing_queue.js
          python -m py_compile scripts/nvidia_role_full_catalog_campaign.py
          python -m unittest discover -s tests -p 'test_nvidia_full_catalog_campaign.py' -v
          python - <<'PY'
          import re
          from pathlib import Path
          raw=Path('ops/nvidia_role_batch_trigger.txt').read_text().strip()
          if raw == 'auto':
              print('NVIDIA_ROLE_BATCHES_SELECTED=AUTO_DUE')
              print('ROLE_MAX_PROVIDER_REQUESTS=37')
              raise SystemExit(0)
          if raw == 'all':
              print('NVIDIA_ROLE_BATCHES_SELECTED=ALL_ELIGIBLE')
              print('ROLE_MAX_PROVIDER_REQUESTS=4000')
              print('ROLE_MAX_WINDOW_SECONDS=14400')
              print('ROLE_PAYLOAD_PRIVATE_DATA=false')
              raise SystemExit(0)
          if re.fullmatch(r'batch=(-2|-1|[0-9]|[1-9][0-9])',raw):
              selected=[int(raw.split('=')[1])]
          else:
              match=re.fullmatch(r'range=([0-9]|[1-9][0-9]):([1-5])',raw)
              if match is None:raise SystemExit('ROLE_BATCH_SELECTOR_NOT_ALLOWED')
              start,count=map(int,match.groups())
              selected=list(range(start,start+count))
              if selected[-1]>99:raise SystemExit('ROLE_BATCH_RANGE_INVALID')
          if len(selected)>5 or len(set(selected))!=len(selected):
              raise SystemExit('ROLE_MAX_FIVE_DISTINCT_BATCHES')
          print('NVIDIA_ROLE_BATCHES_SELECTED='+','.join(map(str,selected)))
          print('ROLE_MAX_PROVIDER_REQUESTS='+str(len(selected)*9))
          print('ROLE_PAYLOAD_PRIVATE_DATA=false')
          PY
      - name: Prepare existing benchmark evidence before provider admission
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ""
          CLOUDFLARE_API_TOKEN: ""
        run: python scripts/nvidia_catalog_lifecycle.py --seed ops/nvidia_shared_benchmark_seed.v1.json --github-history --prepare-history --history-cache nvidia-history.json
      - name: Admit fixed Worker diagnostics temporarily with binding-preserving readback
        shell: bash
        run: |
          set -euo pipefail
          python scripts/nvidia_private_diagnostic_gate_once.py enable
      - name: Execute up to five bounded batches through existing private Service Binding
        shell: bash
        working-directory: approved-source/cloudflare/shared-nvidia-inference
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "abd8fcac5299aaf5308e831db6a1fcfcd5066898"
          export CI=true
          if [ "$(tr -d '\\r\\n' < "$GITHUB_WORKSPACE/ops/nvidia_role_batch_trigger.txt")" = "all" ]; then
            python "$GITHUB_WORKSPACE/scripts/nvidia_role_full_catalog_campaign.py"
            exit 0
          fi
          npx --yes wrangler@4.151.3 dev --config local-probe/wrangler.jsonc --ip 127.0.0.1 --port 8787 > "$RUNNER_TEMP/nvidia_role_local_caller.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl -s --max-time 2 http://127.0.0.1:8787/ -o /dev/null; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then echo 'NVIDIA_PRIVATE_SERVICE_CALLER=UNAVAILABLE'; exit 1; fi
          python - <<'PY'
          import json,os,re,sys
          from datetime import datetime,timezone
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])
          sys.path.insert(0,str(root/'scripts'))
          from nvidia_catalog_lifecycle import project,select_due_batches
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          raw=(Path(os.environ['GITHUB_WORKSPACE'])/'ops/nvidia_role_batch_trigger.txt').read_text().strip()
          if raw=='auto':
              batches=[-1]
          elif re.fullmatch(r'batch=(-2|-1|[0-9]|[1-9][0-9])',raw):
              batches=[int(raw.split('=')[1])]
          else:
              m=re.fullmatch(r'range=([0-9]|[1-9][0-9]):([1-5])',raw)
              if m is None:raise SystemExit('ROLE_BATCH_SELECTOR_INVALID')
              start,count=map(int,m.groups());batches=list(range(start,start+count))
          if not batches or len(batches)>5 or batches[-1]>99:
              raise SystemExit('ROLE_BATCH_COUNT_EXCEEDED')
          automatic=raw=='auto'
          # All non-legacy sweeps begin with a catalog GET. Explicit benchmark
          # requests retain their existing budget and publish on the next refresh.
          if automatic: batches=[-1]
          aggregate=0
          catalog=None
          observations=[]
          for batch in batches:
              data=json.dumps({'batch':batch},separators=(',',':')).encode()
              req=Request('http://127.0.0.1:8787/roles-batch',data=data,
                          headers={'Content-Type':'application/json'},method='POST')
              try:
                  with urlopen(req,timeout=195) as rsp:
                      code=rsp.status;payload=rsp.read(85000)
              except HTTPError as err:
                  code=err.code;payload=err.read(85000)
              try:doc=json.loads(payload)
              except (ValueError,UnicodeError):raise SystemExit('ROLE_RECEIPT_INVALID')
              if doc.get('schema')!='commandcenter.nvidia_synthetic_roles.v1' or doc.get('batch')!=batch:
                  raise SystemExit('ROLE_RECEIPT_CONTRACT_INVALID')
              count=doc.get('calls')
              if type(count)!=int or not 0<=count<=9:
                  raise SystemExit('ROLE_PROVIDER_BUDGET_INVALID')
              aggregate+=count
              if aggregate>(37 if automatic else len(batches)*9):raise SystemExit('ROLE_TOTAL_PROVIDER_BUDGET_EXCEEDED')
              print('NVIDIA_ROLE_CATALOG_HTTP='+str(doc.get('catalog_http')))
              print('NVIDIA_ROLE_CATALOG_COUNT='+str(doc.get('catalog_count')))
              print('NVIDIA_ROLE_ELIGIBLE_COUNT='+str(doc.get('eligible_count')))
              # Provider catalog IDs are public metadata, not private prompts.
              # This catalog-only case performs zero completion requests and
              # prints exact stable sorted indexes for the separate workforce
              # runner, avoiding 404 retries on retired catalog entries.
              if batch == -1:
                  ids=doc.get('eligible_model_ids')
                  if not isinstance(ids,list) or not 1<=len(ids)<=150 or len(set(ids))!=len(ids):
                      raise SystemExit('WORKFORCE_CATALOG_INVALID')
                  all_ids=doc.get('catalog_model_ids')
                  if not isinstance(all_ids,list) or len(all_ids)!=doc.get('catalog_count') or len(set(all_ids))!=len(all_ids) or not set(ids)<=set(all_ids):
                      raise SystemExit('FULL_CATALOG_IDENTITY_INVALID')
                  if count!=1 or doc.get('results'):
                      raise SystemExit('CATALOG_ONLY_REQUEST_BUDGET_INVALID')
                  receipt={'observed_at':datetime.now(timezone.utc).isoformat(),'catalog_model_ids':all_ids,'eligible_model_ids':ids,'catalog_http':doc['catalog_http'],'calls':count,'run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'head_sha':os.environ['GITHUB_SHA']}
                  catalog=receipt
                  (root/'nvidia-current-catalog.json').write_text(json.dumps(receipt,indent=2))
                  if automatic:
                      cache=json.loads((root/'nvidia-history.json').read_text())
                      plan=project(catalog,cache['observations'],datetime.now(timezone.utc),cache['complete'])
                      batches.extend(select_due_batches(catalog,plan))
                      print('NVIDIA_AUTO_DUE_BATCHES='+json.dumps(batches[1:]))
              if batch>=0 and automatic:
                  if doc.get('eligible_model_ids')!=catalog['eligible_model_ids'] or doc.get('catalog_model_ids')!=catalog['catalog_model_ids']:
                      raise SystemExit('CATALOG_CHANGED_DURING_AUTO_REFRESH')
                  if [r.get('model') for r in doc.get('results',[])]!=catalog['eligible_model_ids'][batch*2:batch*2+2]:
                      raise SystemExit('AUTO_MODEL_IDENTITY_MISMATCH')
              if batch == -1:
                  for index,model_id in enumerate(sorted(ids)):
                      if not isinstance(model_id,str) or not re.fullmatch(r'[A-Za-z0-9_.:-]{2,80}/[A-Za-z0-9_.:-]{2,120}',model_id):
                          raise SystemExit('WORKFORCE_CATALOG_MODEL_ID_INVALID')
                      print('NVIDIA_WORKFORCE_CATALOG_INDEX='+json.dumps(
                          {'index':index,'model':model_id},sort_keys=True,separators=(',',':')))
                  print('NVIDIA_WORKFORCE_CATALOG_INDEX_COUNT='+str(len(ids)))
              print('NVIDIA_ROLE_BATCH='+str(batch))
              print('NVIDIA_ROLE_STATUS='+str(doc.get('status')))
              print('NVIDIA_ROLE_PROVIDER_CALLS='+str(count))
              print('NVIDIA_ROLE_ELAPSED_MS='+str(doc.get('elapsed_ms')))
              for item in doc.get('results') or []:
                  model=item.get('model')
                  if not isinstance(model,str) or not re.fullmatch(r'[A-Za-z0-9_.:-]{2,80}/[A-Za-z0-9_.:-]{2,120}',model):
                      raise SystemExit('ROLE_MODEL_IDENTIFIER_INVALID')
                  for task in item.get('results') or []:
                      if task.get('task') not in ('logic','json','math','tool_call','vision'):
                          raise SystemExit('ROLE_TASK_INVALID')
                      row={
                        'model':model,'task':task['task'],'http':task.get('http_status'),
                        'latency_ms':task.get('latency_ms'),'passed':task.get('passed'),
                        'format_valid':task.get('format_valid'),'error':task.get('error')
                      }
                      print('NVIDIA_ROLE_OBSERVATION='+json.dumps(row,sort_keys=True,separators=(',',':')))
                      observations.append({**row,'at':datetime.now(timezone.utc).isoformat(),'run':int(os.environ['GITHUB_RUN_ID']),'job':None})
              print('NVIDIA_ROLE_RAW_ANSWERS_EXPORTED=false')
              print('NVIDIA_ROLE_HOUSEHOLD_DATA_EXPORTED=false')
              print('NVIDIA_ROLE_KEY_EXPORTED=false')
              if code!=200 or doc.get('status') not in ('catalog_only','batch_complete','end_of_catalog'):
                  raise SystemExit('ROLE_BATCH_DID_NOT_COMPLETE')
              print('NVIDIA_ROLE_BATCH_COMPLETED=PASS')
          (root/'nvidia-current-observations.json').write_text(json.dumps(observations))
          print('NVIDIA_ROLE_TOTAL_PROVIDER_CALLS='+str(aggregate))
          print('NVIDIA_ROLE_GROUP_COMPLETED=PASS')
          PY
      - name: Always restore Worker diagnostic off, preserve NVIDIA secret
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python scripts/nvidia_private_diagnostic_gate_once.py restore
          echo 'NVIDIA_ROLE_DIAGNOSTIC_RESTORED=PASS'
      - name: Build shared catalog delta from prior benchmark jobs
        id: lifecycle
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ""
          CLOUDFLARE_API_TOKEN: ""
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f nvidia-current-catalog.json ]; then exit 0; fi
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          path=Path('nvidia-current-observations.json')
          rows=json.loads(path.read_text())
          if rows:
              jobs=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']+'/attempts/'+os.environ['GITHUB_RUN_ATTEMPT']+'/jobs'],text=True))['jobs']
              matched=[j['id'] for j in jobs if j['name']=='synthetic-roles']
              if len(matched)!=1: raise SystemExit('JOB_IDENTITY_UNVERIFIED')
              for row in rows: row['job']=matched[0]
              path.write_text(json.dumps(rows))
          PY
          python scripts/nvidia_catalog_lifecycle.py --catalog nvidia-current-catalog.json --seed ops/nvidia_shared_benchmark_seed.v1.json --output nvidia-model-lifecycle.json --history-cache nvidia-history.json --current-observations nvidia-current-observations.json
          echo 'catalog_ready=true' >> "$GITHUB_OUTPUT"
      - name: Publish sanitized shared model lifecycle
        if: success() && hashFiles('nvidia-model-lifecycle.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-model-lifecycle
          path: nvidia-model-lifecycle.json
          retention-days: 90
  publish-lifecycle:
    needs: synthetic-roles
    if: needs.synthetic-roles.outputs.catalog_ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@v4
        with:
          name: nvidia-model-lifecycle
          path: lifecycle
      - name: Publish only the sanitized model evidence projection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_nvidia_lifecycle.py lifecycle/nvidia-model-lifecycle.json
