name: NVIDIA Private Synthetic Role Batch (existing Service Binding)
on:
  push:
    branches: [main]
    paths: ['ops/nvidia_role_batch_trigger.txt']
permissions:
  contents: read
concurrency:
  group: cc-shared-nvidia-private-controlled-provider-test
  cancel-in-progress: false
jobs:
  synthetic-roles:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: XoticHaze/research-compute-public-
          ref: a3c18f808b7f393410380009908ac65b92f9d1c3
          path: approved-source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate approved exact benchmark and selector
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C approved-source rev-parse HEAD)" = "a3c18f808b7f393410380009908ac65b92f9d1c3"
          (cd approved-source/cloudflare/shared-nvidia-inference && npm test)
          python - <<'PY'
          import re
          from pathlib import Path
          raw=Path('ops/nvidia_role_batch_trigger.txt').read_text().strip()
          if re.fullmatch(r'batch=(-2|-1|[0-9]|[1-9][0-9])',raw):
              selected=[int(raw.split('=')[1])]
          else:
              match=re.fullmatch(r'range=([0-9]|[1-9][0-9]):([1-5])',raw)
              if match is None:raise SystemExit('ROLE_BATCH_SELECTOR_NOT_ALLOWED')
              start,count=map(int,match.groups())
              selected=list(range(start,start+count))
              if selected[-1]>99:raise SystemExit('ROLE_BATCH_RANGE_INVALID')
          if len(selected)>5 or len(set(selected))!=len(selected):
              raise SystemExit('ROLE_MAX_FIVE_DISTINCT_BATCHES')
          print('NVIDIA_ROLE_BATCHES_SELECTED='+','.join(map(str,selected)))
          print('ROLE_MAX_PROVIDER_REQUESTS='+str(len(selected)*9))
          print('ROLE_PAYLOAD_PRIVATE_DATA=false')
          PY
      - name: Admit fixed Worker diagnostics temporarily with binding-preserving readback
        shell: bash
        run: |
          set -euo pipefail
          python scripts/nvidia_private_diagnostic_gate_once.py enable
      - name: Execute up to five bounded batches through existing private Service Binding
        shell: bash
        working-directory: approved-source/cloudflare/shared-nvidia-inference
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a3c18f808b7f393410380009908ac65b92f9d1c3"
          export CI=true
          npx --yes wrangler@4.151.3 dev --config local-probe/wrangler.jsonc --ip 127.0.0.1 --port 8787 > "$RUNNER_TEMP/nvidia_role_local_caller.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl -s --max-time 2 http://127.0.0.1:8787/ -o /dev/null; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then echo 'NVIDIA_PRIVATE_SERVICE_CALLER=UNAVAILABLE'; exit 1; fi
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          raw=(Path(os.environ['GITHUB_WORKSPACE'])/'ops/nvidia_role_batch_trigger.txt').read_text().strip()
          if re.fullmatch(r'batch=(-2|-1|[0-9]|[1-9][0-9])',raw):
              batches=[int(raw.split('=')[1])]
          else:
              m=re.fullmatch(r'range=([0-9]|[1-9][0-9]):([1-5])',raw)
              if m is None:raise SystemExit('ROLE_BATCH_SELECTOR_INVALID')
              start,count=map(int,m.groups());batches=list(range(start,start+count))
          if not batches or len(batches)>5 or batches[-1]>99:
              raise SystemExit('ROLE_BATCH_COUNT_EXCEEDED')
          aggregate=0
          for batch in batches:
              data=json.dumps({'batch':batch},separators=(',',':')).encode()
              req=Request('http://127.0.0.1:8787/roles-batch',data=data,
                          headers={'Content-Type':'application/json'},method='POST')
              try:
                  with urlopen(req,timeout=195) as rsp:
                      code=rsp.status;payload=rsp.read(85000)
              except HTTPError as err:
                  code=err.code;payload=err.read(85000)
              try:doc=json.loads(payload)
              except (ValueError,UnicodeError):raise SystemExit('ROLE_RECEIPT_INVALID')
              if doc.get('schema')!='commandcenter.nvidia_synthetic_roles.v1' or doc.get('batch')!=batch:
                  raise SystemExit('ROLE_RECEIPT_CONTRACT_INVALID')
              count=doc.get('calls')
              if type(count)!=int or not 0<=count<=9:
                  raise SystemExit('ROLE_PROVIDER_BUDGET_INVALID')
              aggregate+=count
              if aggregate>len(batches)*9:raise SystemExit('ROLE_TOTAL_PROVIDER_BUDGET_EXCEEDED')
              print('NVIDIA_ROLE_CATALOG_HTTP='+str(doc.get('catalog_http')))
              print('NVIDIA_ROLE_CATALOG_COUNT='+str(doc.get('catalog_count')))
              print('NVIDIA_ROLE_ELIGIBLE_COUNT='+str(doc.get('eligible_count')))
              print('NVIDIA_ROLE_BATCH='+str(batch))
              print('NVIDIA_ROLE_STATUS='+str(doc.get('status')))
              print('NVIDIA_ROLE_PROVIDER_CALLS='+str(count))
              print('NVIDIA_ROLE_ELAPSED_MS='+str(doc.get('elapsed_ms')))
              for item in doc.get('results') or []:
                  model=item.get('model')
                  if not isinstance(model,str) or not re.fullmatch(r'[A-Za-z0-9_.:-]{2,80}/[A-Za-z0-9_.:-]{2,120}',model):
                      raise SystemExit('ROLE_MODEL_IDENTIFIER_INVALID')
                  for task in item.get('results') or []:
                      if task.get('task') not in ('logic','json','math','tool_call','vision'):
                          raise SystemExit('ROLE_TASK_INVALID')
                      print('NVIDIA_ROLE_OBSERVATION='+json.dumps({
                        'model':model,'task':task['task'],'http':task.get('http_status'),
                        'latency_ms':task.get('latency_ms'),'passed':task.get('passed'),
                        'format_valid':task.get('format_valid'),'error':task.get('error')
                      },sort_keys=True,separators=(',',':')))
              print('NVIDIA_ROLE_RAW_ANSWERS_EXPORTED=false')
              print('NVIDIA_ROLE_HOUSEHOLD_DATA_EXPORTED=false')
              print('NVIDIA_ROLE_KEY_EXPORTED=false')
              if code!=200 or doc.get('status') not in ('catalog_only','batch_complete','end_of_catalog'):
                  raise SystemExit('ROLE_BATCH_DID_NOT_COMPLETE')
              print('NVIDIA_ROLE_BATCH_COMPLETED=PASS')
          print('NVIDIA_ROLE_TOTAL_PROVIDER_CALLS='+str(aggregate))
          print('NVIDIA_ROLE_GROUP_COMPLETED=PASS')
          PY
      - name: Always restore Worker diagnostic off, preserve NVIDIA secret
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python scripts/nvidia_private_diagnostic_gate_once.py restore
          echo 'NVIDIA_ROLE_DIAGNOSTIC_RESTORED=PASS'
