name: NVIDIA Private Flag Safe Disabled Preflight

# One exact Worker in ordinary SlenderIQ, same diagnostic value "0".
# This is a reversible, non-inference admission prerequisite.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nvidia-private-secret-flag-preflight.yml'

permissions:
  contents: read

concurrency:
  group: cc-nvidia-private-secret-flag
  cancel-in-progress: false

jobs:
  no-op-disabled-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check source and no raw secret handling
        run: python -m py_compile scripts/nvidia_private_secret_flag_once.py
      - name: Readback-gated PUT only diagnostic secret 0 (remains off)
        run: |
          set -euo pipefail
          python scripts/nvidia_private_secret_flag_once.py preflight
          echo 'NVIDIA_DIAGNOSTIC_REQUESTS=0'
          echo 'NVIDIA_MODEL_PROBES=0'
