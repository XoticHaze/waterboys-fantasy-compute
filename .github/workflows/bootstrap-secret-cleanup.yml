name: WaterBoys Bootstrap Secret Cleanup R1

on:
  push:
    branches: [main]
    paths:
      - 'rendezvous/fire/waterboys-bootstrap-secret-cleanup-r1'

permissions:
  contents: read

concurrency:
  group: waterboys-bootstrap-secret-cleanup-r1
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Remove one-time ESPN bootstrap secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          config="cloudflare/waterboys-broker/wrangler.jsonc"
          for name in ESPN_USERNAME ESPN_PASSWORD ESPN_OTP; do
            printf 'y\n' | npx --yes wrangler@4.131.2 secret delete "$name" --config "$config"
          done
          echo 'WATERBOYS_BOOTSTRAP_SECRETS_REMOVED=1'
