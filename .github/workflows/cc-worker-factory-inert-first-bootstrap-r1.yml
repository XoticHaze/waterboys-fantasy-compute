name: CC Shared Worker Factory Inert First Bootstrap
# One-use ordinary SlenderIQ account bootstrap, never a standing deployment path.
on:
  push:
    branches: [main]
    paths: ['rendezvous/fire/cc-worker-factory-inert-bootstrap-r1']
permissions:
  contents: read
concurrency:
  group: cc-worker-factory-first-inert-bootstrap
  cancel-in-progress: false
jobs:
  inert-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require exact owner-reviewed trigger, existing ordinary credential
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          text=Path('rendezvous/fire/cc-worker-factory-inert-bootstrap-r1').read_text()
          expected=(
            'schema=commandcenter.factory.inert_first_bootstrap.v1\n'
            'source_sha=41e9010a3c6f5b246d712d1f9d0354713487f6f4\n'
            'account=ce43cd7b917d98a4bb4866d30eed99c0\n'
            'worker=shared-compute-worker-factory\n'
            'scope=inert_source_no_secrets_no_signing_no_pi_no_neutral\n'
            'approval=MW-20261118105634854\n'
          )
          if text!=expected:raise SystemExit('EXACT_BOOTSTRAP_REVIEW_REQUIRED')
          if os.getenv('CLOUDFLARE_ACCOUNT_ID')!='ce43cd7b917d98a4bb4866d30eed99c0':
              raise SystemExit('WRONG_ACCOUNT')
          if not os.getenv('CLOUDFLARE_API_TOKEN'):
              raise SystemExit('EXISTING_DEPLOY_IDENTITY_ABSENT')
          print('FIXED_INERT_BOOTSTRAP_ADMISSION=PASS')
          PY
      - name: Existing Worker inventory must prove target absent
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from urllib.request import Request,urlopen
          a=os.environ['CLOUDFLARE_ACCOUNT_ID'];t=os.environ['CLOUDFLARE_API_TOKEN']
          base='https://api.cloudflare.com/client/v4/accounts/'+a+'/workers/workers'
          names=set()
          for page in range(1,11):
              r=Request(base+'?page='+str(page)+'&per_page=100',
                  headers={'Authorization':'Bearer '+t,'Accept':'application/json'})
              with urlopen(r,timeout=20) as x:doc=json.load(x)
              if doc.get('success') is not True:raise SystemExit('INVENTORY_UNAUTHORIZED')
              rows=doc.get('result') or []
              if isinstance(rows,dict):rows=list(rows.values())
              if not isinstance(rows,list):raise SystemExit('INVENTORY_INVALID')
              names.update(v.get('name') for v in rows if isinstance(v,dict))
              if len(rows)<100:break
          else:raise SystemExit('INVENTORY_NOT_EXHAUSTIVE')
          if 'shared-compute-worker-factory' in names:
              raise SystemExit('FACTORY_ALREADY_EXISTS_NO_OVERWRITE')
          print('EXISTING_TARGET_ABSENT=PASS')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: XoticHaze/research-compute-public-
          ref: 41e9010a3c6f5b246d712d1f9d0354713487f6f4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify exact public tested source and disabled flags
        working-directory: cloudflare/shared-worker-factory
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "41e9010a3c6f5b246d712d1f9d0354713487f6f4"
          node --check src/index.js
          node --test tests/*.test.mjs
          python - <<'PY'
          from pathlib import Path
          c=Path('wrangler.jsonc').read_text()
          for x in ['"FACTORY_EXECUTOR_ENABLED": "0"',
                    '"FACTORY_CREATE_ENABLED": "0"',
                    '"FACTORY_SCOPED_TOKEN_ENABLED": "0"',
                    '"name": "shared-compute-worker-factory"',
                    '"account_id": "ce43cd7b917d98a4bb4866d30eed99c0"']:
              if x not in c:raise SystemExit('INERT_CONFIG_NOT_VERIFIED')
          if '"secrets_store_secrets"' in c:
              raise SystemExit('PUBLIC_BOOTSTRAP_CANNOT_BIND_ADMIN')
          print('SOURCE_INERT_NO_CREDENTIALS=PASS')
          PY
      - name: Deploy inert shared ordinary-account factory only
        working-directory: cloudflare/shared-worker-factory
        shell: bash
        run: |
          set -euo pipefail
          if ! npx --yes wrangler@4.131.2 deploy --config wrangler.jsonc > "$RUNNER_TEMP/cc-factory-inert.log" 2>&1; then
            echo 'FACTORY_INERT_DEPLOY=REJECTED'
            exit 1
          fi
          echo 'FACTORY_INERT_DEPLOY=PASS'
          echo 'ADMIN_SECRET_BINDING=NONE'
      - name: Read back inert target and no privileged bindings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json
          from urllib.request import Request,urlopen
          a=os.environ['CLOUDFLARE_ACCOUNT_ID'];t=os.environ['CLOUDFLARE_API_TOKEN']
          u='https://api.cloudflare.com/client/v4/accounts/'+a+'/workers/scripts/shared-compute-worker-factory/settings'
          with urlopen(Request(u,headers={'Authorization':'Bearer '+t,'Accept':'application/json'}),timeout=20) as x:
              doc=json.load(x)
          if doc.get('success') is not True:raise SystemExit('WORKER_READBACK_FAILED')
          rows=(doc.get('result') or {}).get('bindings') or []
          b={v.get('name'):v for v in rows if isinstance(v,dict)}
          for k in ['FACTORY_EXECUTOR_ENABLED','FACTORY_CREATE_ENABLED','FACTORY_SCOPED_TOKEN_ENABLED']:
              if b.get(k,{}).get('text')!='0':raise SystemExit('FACTORY_FLAG_UNSAFE')
          if b.get('FACTORY_LEDGER',{}).get('type')!='durable_object_namespace':
              raise SystemExit('REPLAY_LEDGER_MISSING')
          for k in ['FACTORY_WORKERS_ADMIN','FACTORY_TOKEN_ISSUER','FACTORY_SECRET_WRITER','FACTORY_QUEUE_GITHUB_TOKEN']:
              if k in b:raise SystemExit('UNEXPECTED_PRIVILEGED_BINDING')
          print('FACTORY_INERT_LIVE_READBACK=PASS')
          print('LIVE_FACTORY_EXECUTOR_ADMISSION=HELD')
          PY
