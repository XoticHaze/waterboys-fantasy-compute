name: CC Existing Shared Factory Read-Only Inventory

# Bounded GET-only checks using EXISTING ordinary-account credential.
# Neither check sends asset bytes or performs Cloudflare mutation/deploy.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cc-factory-existing-readonly.yml'
      - 'scripts/cc_factory_existing_worker_readonly.py'
      - 'scripts/cc_incomeengine_studio_cloudflare_readonly.py'
      - 'tests/test_cc_incomeengine_studio_cloudflare_readonly.py'

permissions:
  contents: read

jobs:
  existing-factory-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read only existing factory settings and deployment metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/cc_factory_existing_worker_readonly.py
          python scripts/cc_factory_existing_worker_readonly.py
      - name: Inspect IncomeEngine Studio zone / DNS / Access with fixed GETs only
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_cc_incomeengine_studio_cloudflare_readonly.py' -v
          python -m py_compile scripts/cc_incomeengine_studio_cloudflare_readonly.py
          python scripts/cc_incomeengine_studio_cloudflare_readonly.py