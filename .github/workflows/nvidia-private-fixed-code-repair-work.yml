name: NVIDIA Private Fixed Code Repair Work
on:
  push:
    branches: [main]
    paths: ['ops/nvidia_code_work_trigger.txt']
permissions:
  contents: read
concurrency:
  group: cc-shared-nvidia-private-controlled-provider-test
  cancel-in-progress: false
jobs:
  single-fixed-model-code-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: XoticHaze/research-compute-public-
          ref: 367b4cb5461cf5082ae5abf6212c51a111a5035b
          path: approved-source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify exact reviewed source, fixed selector and all offline contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C approved-source rev-parse HEAD)" = '367b4cb5461cf5082ae5abf6212c51a111a5035b'
          selector="$(cat ops/nvidia_code_work_trigger.txt)"
          test "$selector" = 'code=poolside' || test "$selector" = 'code=minimax'
          (cd approved-source/cloudflare/shared-nvidia-inference && npm test)
          python -m py_compile scripts/nvidia_fixed_code_repair_work.py
          python -m unittest discover -s tests -p 'test_nvidia_fixed_code_repair_work.py' -v
          node --check approved-source/cloudflare/shared-nvidia-inference/src/index.js
          node --check approved-source/cloudflare/shared-nvidia-inference/src/fixed_code_repair_runner.js
          node --check approved-source/cloudflare/shared-nvidia-inference/local-probe/src/index.js
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const cfg=JSON.parse(fs.readFileSync('approved-source/cloudflare/shared-nvidia-inference/wrangler.jsonc','utf8'));
          assert.equal(cfg.name,'cc-shared-nvidia-inference');
          assert.equal(cfg.workers_dev,false);
          assert.equal(cfg.preview_urls,false);
          assert.equal(cfg.vars.CC_NVIDIA_DIAGNOSTIC_ENABLED,'0');
          console.log('FIXED_CODE_PRIVATE_ONLY=PASS');
          JS
      - name: Enable original disabled private diagnostic only for this one synthetic job
        shell: bash
        run: |
          set -euo pipefail
          python scripts/nvidia_private_diagnostic_gate_once.py enable
      - name: Request one model-created patch and verify 23 behaviors using AST-only interpreter
        working-directory: approved-source/cloudflare/shared-nvidia-inference
        shell: bash
        run: |
          set -euo pipefail
          selector="$(cat "$GITHUB_WORKSPACE/ops/nvidia_code_work_trigger.txt")"
          if [ "$selector" = 'code=poolside' ]; then
             python "$GITHUB_WORKSPACE/scripts/nvidia_fixed_code_repair_work.py" poolside
          elif [ "$selector" = 'code=minimax' ]; then
             python "$GITHUB_WORKSPACE/scripts/nvidia_fixed_code_repair_work.py" minimax
          else
             exit 1
          fi
      - name: Always restore diagnostic=0 and verify existing NVIDIA secret binding
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python scripts/nvidia_private_diagnostic_gate_once.py restore
          echo 'NVIDIA_CODE_WORK_DIAGNOSTIC_RESTORED=PASS'
