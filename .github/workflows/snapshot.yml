name: WaterBoys Snapshot R1

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
  push:
    branches: [main]
    paths:
      - 'rendezvous/fire/waterboys-snapshot-r1'

permissions:
  contents: read
  id-token: write

concurrency:
  group: waterboys-snapshot-r1
  cancel-in-progress: false

env:
  WATERBOYS_BROKER_URL: https://waterboys-fantasy-broker.slenderiq.workers.dev

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install collector
        run: python -m pip install --disable-pip-version-check .
      - name: Collect authenticated private ESPN snapshot
        run: |
          set -euo pipefail
          python -m waterboys_compute.cli snapshot --broker "$WATERBOYS_BROKER_URL"
