name: NVIDIA Direct Existing GitHub Credential Proof (One Shot)
# Direct synthetic research on the existing trusted GitHub compute plane.
# Does not touch Cloudflare, HAOS, external model inference code or GitHub repository secrets.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nvidia-direct-existing-secret-proof-once.yml']
permissions:
  contents: read
concurrency:
  group: nvidia-direct-existing-github-credential-one-shot
  cancel-in-progress: false
jobs:
  direct-nvidia-developer-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - name: Run fixed direct catalog and synthetic completion tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          KEY = os.environ.get("NVIDIA_API_KEY", "").strip()
          ORIGIN = "https://integrate.api.nvidia.com/v1"
          MODELS = [
              "openai/gpt-oss-20b",
              "nvidia/nemotron-3.5-lightning-30b-a3b",
              "nvidia/nemotron-3-super-120b-a12b",
          ]
          print("NVIDIA_DIRECT_CREDENTIAL_SOURCE=github_actions_repo_secret")
          if not KEY:
              print("NVIDIA_GITHUB_REPOSITORY_SECRET_PRESENT=false")
              print("NVIDIA_PROVIDER_CALLS=0")
              print("NVIDIA_RESULT=NO_GITHUB_REPOSITORY_SECRET_EXPOSED_TO_RUN")
              raise SystemExit(0)
          print("NVIDIA_GITHUB_REPOSITORY_SECRET_PRESENT=true")
          if not KEY.startswith("nvapi-"):
              print("NVIDIA_GITHUB_SECRET_FORMAT=unexpected")
          else:
              print("NVIDIA_GITHUB_SECRET_FORMAT=expected")

          attempts = 0
          def request(method, endpoint, payload=None):
              global attempts
              body = None if payload is None else json.dumps(payload, separators=(",", ":")).encode("utf-8")
              headers = {
                  "Authorization": "Bearer " + KEY,
                  "Accept": "application/json",
                  "User-Agent": "waterboys-nvidia-existing-secret-fixed-synthetic-r1",
              }
              if body is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(ORIGIN + endpoint, data=body, headers=headers, method=method)
              attempts += 1
              started = time.monotonic()
              try:
                  with urllib.request.urlopen(req, timeout=25) as res:
                      code = res.status
                      raw = res.read(512_000)
              except urllib.error.HTTPError as exc:
                  code = exc.code
                  raw = b""
              except (urllib.error.URLError, TimeoutError, OSError):
                  return None, None, round((time.monotonic() - started) * 1000)
              # Never print or save raw provider response; parse only fixed fields.
              try:
                  decoded = json.loads(raw) if code == 200 else None
              except (ValueError, UnicodeError):
                  decoded = None
              return code, decoded, round((time.monotonic() - started) * 1000)

          code, catalog, latency = request("GET", "/models")
          print("NVIDIA_CATALOG_HTTP=" + str(code if code is not None else "transport_error"))
          print("NVIDIA_CATALOG_LATENCY_MS=" + str(latency))
          rows = catalog.get("data") if isinstance(catalog, dict) else None
          ids = {x["id"] for x in rows if isinstance(x, dict) and isinstance(x.get("id"), str)} if isinstance(rows, list) else set()
          print("NVIDIA_AUTHENTICATED_CATALOG_COUNT=" + (str(len(ids)) if code == 200 else "unverified"))
          any_valid = False
          for index, model in enumerate(MODELS):
              if code != 200 or model not in ids:
                  print("NVIDIA_MODEL_"+str(index)+"_CATALOG_LISTED="+str(model in ids).lower())
                  continue
              body = {
                  "model": model, "messages": [
                      {"role": "user", "content": "Synthetic API test. Reply with PING_OK."}
                  ], "temperature": 0, "max_tokens": 48, "stream": False
              }
              status, data, duration = request("POST", "/chat/completions", body)
              choices = data.get("choices") if isinstance(data, dict) else None
              msg = choices[0].get("message") if isinstance(choices, list) and choices and isinstance(choices[0], dict) else None
              answer = msg.get("content") if isinstance(msg, dict) else None
              valid = status == 200 and isinstance(answer, str) and bool(answer.strip())
              print("NVIDIA_MODEL_"+str(index)+"="+model)
              print("NVIDIA_MODEL_"+str(index)+"_HTTP="+str(status if status is not None else "transport_error"))
              print("NVIDIA_MODEL_"+str(index)+"_LATENCY_MS="+str(duration))
              print("NVIDIA_MODEL_"+str(index)+"_COMPLETION_VALID="+str(valid).lower())
              any_valid |= valid
              if status in (401, 429):
                  print("NVIDIA_STOP_REASON="+("AUTH_REJECTED" if status==401 else "RATE_LIMITED"))
                  break
              time.sleep(1)
          print("NVIDIA_PROVIDER_CALLS="+str(attempts))
          print("NVIDIA_COMPLETION_PROVEN="+str(any_valid).lower())
          print("NVIDIA_RAW_MODEL_TEXT_EXPORTED=false")
          print("NVIDIA_KEY_EXPORTED=false")
          print("NVIDIA_HOUSEHOLD_INPUTS=0")
          PY
