name: NVIDIA Remove Wrong Worker-Only Secret (One Shot)

# Only removes Worker-local secret_text NVIDIA_API_KEY from the named,
# disabled private inference Worker. Never accesses the account Secrets Store.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nvidia-wrong-worker-secret-cleanup-once.yml'

permissions:
  contents: read

concurrency:
  group: nvidia-worker-local-secret-cleanup-once
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Remove only verified wrong-kind NVIDIA Worker-local secret
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re,time
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          account=os.environ.get('CLOUDFLARE_ACCOUNT_ID','')
          token=os.environ.get('CLOUDFLARE_API_TOKEN','')
          if not re.fullmatch(r'[a-fA-F0-9]{32}', account) or not token:
              raise SystemExit('EXISTING_CLOUDFLARE_AUTH_MISSING')
          root=f'https://api.cloudflare.com/client/v4/accounts/{account}'
          def request(method,path):
              req=Request(root+path,method=method,headers={
                  'Authorization':'Bearer '+token,'Accept':'application/json',
                  'User-Agent':'nvidia-dedicated-worker-wrong-kind-cleanup',
              })
              try:
                  with urlopen(req,timeout=20) as r:
                      status=int(r.status);raw=r.read(250000)
              except HTTPError as e:
                  status=int(e.code);raw=e.read(250000)
              try: node=json.loads(raw) if raw else {}
              except (ValueError,UnicodeError): node={}
              return status,node
          worker='/workers/scripts/cc-shared-nvidia-inference'
          control,_=request('GET','/workers/scripts/waterboys-fantasy-broker/settings')
          if control!=200: raise SystemExit('ORDINARY_SLENDERIQ_ACCOUNT_NOT_PROVEN')
          status,doc=request('GET',worker+'/settings')
          if status!=200 or doc.get('success') is not True:
              raise SystemExit('NVIDIA_WORKER_SETTINGS_NOT_AVAILABLE')
          bindings=(doc.get('result') or {}).get('bindings') or []
          candidates=[b for b in bindings if isinstance(b,dict) and b.get('name')=='NVIDIA_API_KEY']
          if len(candidates)!=1 or candidates[0].get('type')!='secret_text':
              raise SystemExit('NO_EXACT_WRONG_TYPE_SECRET_TEXT_TO_CLEAN')
          # Never delete a correct Secrets Store binding or unrelated variable.
          status,_=request('DELETE',worker+'/secrets/NVIDIA_API_KEY')
          if status not in (200,202,204):
              print('NVIDIA_WORKER_LOCAL_SECRET_DELETE=REJECTED_HTTP_'+str(status))
              raise SystemExit(1)
          print('NVIDIA_WORKER_LOCAL_SECRET_DELETE=ACCEPTED')
          for attempt in range(3):
              status,doc=request('GET',worker+'/settings')
              bindings=((doc.get('result') or {}).get('bindings') or []) if isinstance(doc,dict) else []
              names=[b.get('name') for b in bindings if isinstance(b,dict)]
              if status==200 and doc.get('success') is True and 'NVIDIA_API_KEY' not in names:
                  print('NVIDIA_WORKER_LOCAL_SECRET_REMOVED=VERIFIED')
                  print('NVIDIA_ACCOUNT_SECRET_STORE_UNTOUCHED=TRUE')
                  print('NVIDIA_INFERENCE_EXECUTED=FALSE')
                  break
              time.sleep(2)
          else:
              raise SystemExit('WORKER_BINDING_REMOVAL_READBACK_PENDING')
          PY
