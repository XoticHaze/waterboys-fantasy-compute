name: NVIDIA Fixed Fictional Evidence Status Live Revision (Private Bound Worker)
# Candidate-only until owner-approved deployment of the exact pinned source.
# No arbitrary prompts, real private inputs, model prose or protected actions.
on:
  push:
    branches: [main]
    paths: ['ops/nvidia_evidence_status_live_trigger.txt']
permissions:
  contents: read
  actions: read
concurrency:
  group: cc-shared-nvidia-private-controlled-provider-test
  cancel-in-progress: false
jobs:
  run-feedback-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_API_READ_TOKEN: ${{ github.token }}
      EVIDENCE_STATUS_SOURCE_SHA: bccfa9ef96709942c31f2ed5c1ec39aeccfa1669
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: controller
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: XoticHaze/research-compute-public-
          ref: bccfa9ef96709942c31f2ed5c1ec39aeccfa1669
          path: reviewed-source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify source, fixed selector, reviewed release and offline tests
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git -C reviewed-source rev-parse HEAD)" = "bccfa9ef96709942c31f2ed5c1ec39aeccfa1669"
          python - <<'PY'
          import os,re,json,base64
          from pathlib import Path
          from urllib.request import Request,urlopen
          sha="bccfa9ef96709942c31f2ed5c1ec39aeccfa1669"
          cfg=json.loads(Path("reviewed-source/cloudflare/shared-nvidia-inference/wrangler.jsonc").read_text())
          if not (cfg.get("name")=="cc-shared-nvidia-inference" and
                  cfg.get("workers_dev") is False and cfg.get("preview_urls") is False and
                  cfg.get("vars",{}).get("CC_NVIDIA_DIAGNOSTIC_ENABLED")=="0" and
                  "route" not in cfg and "routes" not in cfg and "secrets_store_secrets" not in cfg):
              raise SystemExit("V4_PRIVATE_WORKER_CONFIG_INVALID")
          raw=Path("controller/ops/nvidia_evidence_status_live_trigger.txt").read_text().strip()
          expr=r"evidence=live;source="+sha+r";release_run=([0-9]{8,20});release_sha=([a-f0-9]{40});nonce=([A-Za-z0-9_-]{12,64})"
          match=re.fullmatch(expr,raw)
          if match is None:raise SystemExit("V4_FIXED_SYNTHETIC_SELECTOR_REQUIRED")
          release_run,release_sha,_=match.groups()
          repo="XoticHaze/waterboys-fantasy-compute"
          headers={"Authorization":"Bearer "+os.environ["GITHUB_API_READ_TOKEN"],
                   "Accept":"application/vnd.github+json",
                   "User-Agent":"cc-nvidia-v4-exact-release-verify"}
          def github(url):
              with urlopen(Request(url,headers=headers),timeout=20) as r:return json.load(r)
          run=github("https://api.github.com/repos/"+repo+"/actions/runs/"+release_run)
          if not (run.get("id")==int(release_run) and run.get("head_sha")==release_sha
             and run.get("status")=="completed" and run.get("conclusion")=="success"
             and run.get("event")=="push" and run.get("run_attempt")==1 and
             str(run.get("path","")).startswith(".github/workflows/nvidia-evidence-status-bound-release-r1.yml")):
              raise SystemExit("V4_OWNER_DEPLOYMENT_NOT_VERIFIED")
          m=github("https://api.github.com/repos/"+repo+
              "/contents/ops/nvidia_evidence_status_bound_release_trigger.txt?ref="+release_sha)
          body=base64.b64decode(m.get("content","")).decode("utf-8")
          if "reviewed_public_source_sha="+sha not in body or (
             "approval_scope=existing_private_synthetic_evidence_status_revision_only" not in body):
              raise SystemExit("V4_DEPLOYMENT_SCOPE_MISMATCH")
          # The referenced successful release must have executed the exact
          # V4-pinned reviewed deploy workflow, not a historical V3 workflow.
          w=github("https://api.github.com/repos/"+repo+
              "/contents/.github/workflows/nvidia-evidence-status-bound-release-r1.yml?ref="+release_sha)
          workflow=base64.b64decode(w.get("content","")).decode("utf-8")
          if not ("ref: bccfa9ef96709942c31f2ed5c1ec39aeccfa1669" in workflow and
              "EXACT_REVIEWED_EVIDENCE_STATUS_RELEASE_MANIFEST=PASS" in workflow and
              "flag.get('text')!='0'" in workflow):
              raise SystemExit("V4_RELEASE_WORKFLOW_SOURCE_NOT_VERIFIED")
          # Confirm the exact Worker version actively serving was created
          # inside the independently authenticated successful release run.
          # No payload or token is emitted, and a later unrelated deployment
          # must not inherit the release run's trust.
          from datetime import datetime,timezone,timedelta
          import uuid
          def utc(raw):
              if not isinstance(raw,str):raise SystemExit("V4_VERSION_TIME_UNTRUSTED")
              try:return datetime.fromisoformat(raw.replace("Z","+00:00")).astimezone(timezone.utc)
              except (ValueError,TypeError):raise SystemExit("V4_VERSION_TIME_INVALID")
          account=os.environ.get("CLOUDFLARE_ACCOUNT_ID","")
          token=os.environ.get("CLOUDFLARE_API_TOKEN","")
          if not re.fullmatch(r"[a-fA-F0-9]{32}",account) or len(token)<8:
              raise SystemExit("V4_CLOUDFLARE_AUTH_NOT_READY")
          url=("https://api.cloudflare.com/client/v4/accounts/"+account+
              "/workers/scripts/cc-shared-nvidia-inference/deployments")
          req=Request(url,headers={"Authorization":"Bearer "+token,
                                   "Accept":"application/json"})
          with urlopen(req,timeout=20) as response: actual=json.load(response)
          deployments=actual.get("result",{}).get("deployments",[])
          if actual.get("success") is not True or not isinstance(deployments,list) or not deployments:
              raise SystemExit("V4_ACTIVE_DEPLOYMENT_UNVERIFIED")
          active=deployments[0]
          versions=active.get("versions",[]) if isinstance(active,dict) else []
          if not isinstance(versions,list) or len(versions)!=1 or versions[0].get("percentage")!=100:
              raise SystemExit("V4_ACTIVE_DEPLOYMENT_NOT_EXACT")
          try:
              current_version=str(uuid.UUID(versions[0]["version_id"]))
              deployment_id=str(uuid.UUID(active["id"]))
              created=utc(active["created_on"])
          except (ValueError,KeyError,TypeError):
              raise SystemExit("V4_ACTIVE_VERSION_UNTRUSTED")
          start=utc(run.get("run_started_at") or run.get("created_at"))
          finished=utc(run.get("updated_at"))
          if not (start<=created<=finished+timedelta(seconds=90)):
              raise SystemExit("V4_ACTIVE_VERSION_NOT_FROM_REVIEWED_RELEASE")
          print("V4_ACTIVE_DEPLOYMENT_VERSION_VERIFIED=PASS")
          print("V4_ACTIVE_VERSION_ID="+current_version)
          print("V4_ACTIVE_DEPLOYMENT_ID="+deployment_id)
          print("V4_PREVIOUS_PROTECTED_DEPLOYMENT_VERIFIED=PASS")
          print("V4_PRIVATE_INPUT_USED=false")
          PY
          (cd reviewed-source/cloudflare/shared-nvidia-inference && npm test)
          node --check reviewed-source/cloudflare/shared-nvidia-inference/src/micro_feedback_runner.js
          node --check reviewed-source/cloudflare/shared-nvidia-inference/local-probe/src/feedback_caller.js
          node --check reviewed-source/cloudflare/shared-nvidia-inference/src/evidence_status_loop.js
          node --check reviewed-source/cloudflare/shared-nvidia-inference/local-probe/src/evidence_status_caller.js
      - name: Admit exact existing Cloudflare private Service Binding temporarily
        shell: bash
        working-directory: controller
        run: |
          set -euo pipefail
          python scripts/nvidia_private_diagnostic_gate_once.py enable
      - name: Run model source through independent AST tests and one bounded correction
        shell: bash
        working-directory: reviewed-source/cloudflare/shared-nvidia-inference
        run: |
          set -euo pipefail
          export CI=true
          test "$(git rev-parse HEAD)" = "bccfa9ef96709942c31f2ed5c1ec39aeccfa1669"
          python3 -m py_compile "$GITHUB_WORKSPACE/controller/scripts/nvidia_evidence_status_artifact_live_loop.py"
          python3 -m unittest discover -s "$GITHUB_WORKSPACE/controller/tests" -p 'test_nvidia_evidence_status_artifact.py' -v
          node --check local-probe/src/evidence_status_caller.js
          npx --yes wrangler@4.151.3 dev --config local-probe/wrangler.evidence.jsonc --ip 127.0.0.1 --port 8787 > "$RUNNER_TEMP/nvidia_evidence_status_local.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 45); do
            if curl --silent --max-time 2 http://127.0.0.1:8787/ -o /dev/null; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then echo 'NVIDIA_EVIDENCE_PRIVATE_CALLER_UNAVAILABLE'; exit 1; fi
          PYTHONPATH="$GITHUB_WORKSPACE/controller/scripts" python3 "$GITHUB_WORKSPACE/controller/scripts/nvidia_evidence_status_artifact_live_loop.py"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/nvidia-evidence-status/evaluation.json")
          a=json.loads(p.read_text())
          if (a["schema"]!="commandcenter.public_synthetic_evidence_status_review.v1" or
              not a["fictional_only"] or a["private_input_used"] or a["model_code_executed"] or
              a["commands_executed"] or a["production_admitted"] or
              a["provider_requests"] not in (1,2) or a["baseline"]["total"]!=100 or
              a["outcome"] not in ("FIRST_DRAFT_PASSED_NO_CORRECTION","CORRECTED_ALL_HOLDOUTS",
                                   "PARTIAL_IMPROVEMENT","NO_GAIN","REGRESSED_REJECTED","REVISION_UNAVAILABLE")):
              raise SystemExit("NVIDIA_EVIDENCE_STATUS_UNTRUSTED")
          print("NVIDIA_EVIDENCE_STATUS_CAPTURED="+a["outcome"])
          PY
      - name: Always restore disabled diagnostics and original Secrets Store binding
        if: always()
        shell: bash
        working-directory: controller
        run: |
          set -euo pipefail
          python scripts/nvidia_private_diagnostic_gate_once.py restore
          echo V4_NVIDIA_DIAGNOSTIC_RESTORED_DISABLED=PASS
      - name: Export only sanitized fictional feedback scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-evidence-status-live-revision
          path: reviewed-source/cloudflare/shared-nvidia-inference/artifacts/nvidia-evidence-status/*
          retention-days: 14
          if-no-files-found: ignore
