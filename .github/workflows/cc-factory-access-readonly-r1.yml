name: CC Factory Access Anonymous Readback and Existing Bindings
# Public GitHub compute, fixed GET-only Cloudflare public status and existing
# bounded Worker settings under preexisting deploy credential. Never mutates.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cc-factory-access-readonly-r1.yml'
      # Reusable GitHub-backed GET-only operator fire path: no Cloudflare writes.
      # Update an immutable reviewed request marker on main to refresh the
      # run/SHA-bound sanitized audit without editing workflow source.
      - 'rendezvous/fire/cc-factory-readonly-r1'
      - 'scripts/cc_factory_access_edge_readonly.py'
      - 'tests/test_cc_factory_access_edge_readonly.py'
      - 'scripts/cc_factory_existing_worker_readonly.py'
      - 'tests/test_cc_factory_legacy_token_scope_readonly.py'
      - 'scripts/cloudflare_r2_scope_preflight.py'
      - 'tests/test_cloudflare_r2_scope_preflight.py'

concurrency:
  group: cc-factory-readonly-and-public-receipt
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  edge-and-identity-bindings:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_DEPLOY_TOKEN_R2: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN_R2 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Pure policy classifiers, no network
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_cc_factory_access_edge_readonly.py' -v
          python -m unittest discover -s tests -p 'test_cc_factory_legacy_token_scope_readonly.py' -v
          python -m py_compile scripts/cc_factory_existing_worker_readonly.py
          python -m unittest discover -s tests -p 'test_cloudflare_r2_scope_preflight.py' -v
          python -m py_compile scripts/cloudflare_r2_scope_preflight.py
      # When the preexisting narrow R2 secret is enrolled, require the complete
      # fixed Worker allow/deny readback BEFORE any broker deployment. This
      # job has contents:read and performs only GET Cloudflare metadata.
      - name: Verify enrolled narrow R2 Worker metadata scope without mutation
        if: ${{ env.CLOUDFLARE_DEPLOY_TOKEN_R2 != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_DEPLOY_TOKEN_R2 }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cloudflare_r2_scope_preflight.py
      - name: Anonymous fixed production endpoint denies
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cc_factory_access_edge_readonly.py
      # Includes redacted GET-only self-token metadata discriminator. It does
      # not prove protected Worker rewrite DENY and cannot issue or revoke tokens.
      - name: Existing Cloudflare Workers setting and owner binding presence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cc_factory_existing_worker_readonly.py
      - name: Export scrubbed read-only evidence, no API token values
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cc-factory-sanitized-readback
          path: cc-factory-readback.json
          if-no-files-found: error
          retention-days: 7

  publish-sanitized-receipt:
    needs: edge-and-identity-bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    # This job is credential-free: it has NO CLOUDFLARE_* secret env bindings.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Retrieve exact scrubbed source result only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cc-factory-sanitized-readback
          path: ${{ runner.temp }}/cc-factory-sanitized
      - name: Validate and commit nonsecret run-specific + current receipts
        shell: bash
        env:
          CC_READBACK_SOURCE: ${{ runner.temp }}/cc-factory-sanitized/cc-factory-readback.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          doc=json.loads(Path(os.environ['CC_READBACK_SOURCE']).read_text(encoding='utf-8'))
          keys={'schema','github_run_id','github_head_sha','observed_at_utc',
                'factory_deployment_identity','factory_script_fingerprint',
                'source_role','factory_settings_http','factory_id_verified',
                'access_app_present','factory_execution_flags',
                'factory_privileged_bindings','legacy_token',
                'scoped_r2_token','cloudflare_mutations','credential_values_exported',
                'write_denial_proven','release_or_admin_admitted','classification'}
          if set(doc)!=keys: raise SystemExit('READBACK_UNEXPECTED_FIELD_DENIED')
          if doc['schema']!='commandcenter.cloudflare.factory_scope_audit_receipt.v1':
              raise SystemExit('READBACK_SCHEMA_DENIED')
          rid=str(doc['github_run_id'])
          if not re.fullmatch('[0-9]{5,20}',rid) or rid!=os.environ['GITHUB_RUN_ID']:
              raise SystemExit('READBACK_RUN_ID_DENIED')
          sha=str(doc['github_head_sha'])
          if not re.fullmatch('[a-f0-9]{40}',sha) or sha!=os.environ['GITHUB_SHA']:
              raise SystemExit('READBACK_SOURCE_SHA_DENIED')
          if doc['cloudflare_mutations']!=0 or doc['credential_values_exported'] is not False:
              raise SystemExit('READBACK_MUTATION_OR_CREDENTIAL_FLAG_DENIED')
          if doc['write_denial_proven'] is not False or doc['release_or_admin_admitted'] is not False:
              raise SystemExit('READBACK_FALSE_ADMISSION')
          if doc['classification']!='GET_ONLY_SCOPE_EVIDENCE_NOT_WRITE_DENIAL_PROOF':
              raise SystemExit('READBACK_CLASSIFICATION_DENIED')
          deployment=doc['factory_deployment_identity']
          if not isinstance(deployment,dict) or set(deployment)!={
              'deployment_id','full_traffic_version_id',
              'unique_full_traffic_version','source_content_attested'}:
              raise SystemExit('READBACK_DEPLOYMENT_FIELDS_DENIED')
          uuid=r'[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}'
          for field in ('deployment_id','full_traffic_version_id'):
              value=deployment[field]
              if value is not None and not re.fullmatch(uuid,value):
                  raise SystemExit('READBACK_DEPLOYMENT_UUID_DENIED')
          if deployment['unique_full_traffic_version'] is not True and deployment[
              'full_traffic_version_id'] is not None:
              raise SystemExit('READBACK_DEPLOYMENT_PERCENT_UNVERIFIED')
          if deployment['source_content_attested'] is not False:
              raise SystemExit('READBACK_FALSE_SOURCE_VERIFICATION')
          fp=doc['factory_script_fingerprint']
          if set(fp)!={'http_status','sha256','byte_length','complete_read',
                      'source_equals_reviewed_commit','source_bytes_exported',
                      'hash_basis','response_media_type','part_count'}:
              raise SystemExit('READBACK_FINGERPRINT_FIELDS_INVALID')
          if fp['source_equals_reviewed_commit'] is not False or fp['source_bytes_exported'] is not False:
              raise SystemExit('READBACK_SOURCE_CONTENT_OR_OVERCLAIM_DENIED')
          if fp['complete_read'] is True:
              if fp['http_status']!=200 or not re.fullmatch(r'[a-f0-9]{64}',str(fp['sha256'])) or (
                      not isinstance(fp['byte_length'],int) or not 1<=fp['byte_length']<=1048576):
                  raise SystemExit('READBACK_FINGERPRINT_INVALID')
              if fp['hash_basis']=='CANONICAL_MULTIPART_PARTS_V1':
                  if fp['response_media_type'] not in ('multipart/form-data','multipart/mixed','multipart/related') or (
                          not isinstance(fp['part_count'],int) or not 1<=fp['part_count']<=50):
                      raise SystemExit('READBACK_CANONICAL_MULTIPART_INVALID')
              elif fp['hash_basis']=='RAW_HTTP_BODY_UNVERIFIED_STABILITY':
                  if fp['part_count'] is not None or fp['response_media_type'] not in (
                          'UNVERIFIED','application/javascript','application/octet-stream',
                          'text/javascript','text/plain'):
                      raise SystemExit('READBACK_RAW_UNSTABLE_CLASS_INVALID')
              else:
                  raise SystemExit('READBACK_UNKNOWN_FINGERPRINT_BASIS')
          elif fp['complete_read'] is False:
              if fp['sha256'] is not None or fp['byte_length'] is not None or fp['http_status'] not in (
                      'NOT_VERIFIED','UNAVAILABLE',200,401,403,404,413,429,500,502,503) or (
                      fp['hash_basis']!='NOT_VERIFIED' or fp['response_media_type']!='UNVERIFIED' or
                      fp['part_count'] is not None):
                  raise SystemExit('READBACK_FINGERPRINT_UNVERIFIED')
          else:
              raise SystemExit('READBACK_FINGERPRINT_BOOLEAN_INVALID')
          flags=doc['factory_execution_flags']
          if set(flags)!={'FACTORY_EXECUTOR_ENABLED','FACTORY_CREATE_ENABLED',
                          'FACTORY_INSPECT_ENABLED','FACTORY_SCOPED_TOKEN_ENABLED',
                          'FACTORY_STAGE_VERSION_ENABLED',
                          'FACTORY_MACHINE_READONLY_ENABLED',
                          'FACTORY_MACHINE_INSPECT_ENABLED'} or not all(
                          x in ('0','1','UNVERIFIED') for x in flags.values()):
              raise SystemExit('READBACK_FLAGS_UNEXPECTED')
          bindings=doc['factory_privileged_bindings']
          if set(bindings)!={'FACTORY_WORKERS_ADMIN','FACTORY_TOKEN_ISSUER',
                             'FACTORY_SECRET_WRITER','FACTORY_QUEUE_GITHUB_TOKEN'} or not all(
                             x in ('PRESENT','NOT_LISTED','UNVERIFIED')
                             for x in bindings.values()):
              raise SystemExit('READBACK_BINDINGS_UNEXPECTED')
          legacy=doc['legacy_token']
          if set(legacy)!={'token_identity_class','self_verify_http','self_detail_http',
              'policy_shape','policy_entry_count','allows_present','denies_present'}:
              raise SystemExit('READBACK_LEGACY_POLICY_SCHEMA_DENIED')
          scoped=doc['scoped_r2_token']
          if set(scoped)!={'configured','existing_broker_settings_http',
              'protected_factory_settings_http'}:
              raise SystemExit('READBACK_SCOPED_POLICY_SCHEMA_DENIED')
          if not isinstance(scoped['configured'],bool):
              raise SystemExit('READBACK_TOKEN_CONFIG_TYPE_DENIED')
          if any(len(str(x))>110 for x in
                 list(legacy.values())+list(scoped.values())):
              raise SystemExit('READBACK_UNBOUNDED_POLICY_FIELD_DENIED')
          if doc['source_role']!='EXISTING_WATERBOYS_PUBLIC_READONLY_WORKFLOW':
              raise SystemExit('READBACK_PROVENANCE_DENIED')
          if not isinstance(doc['observed_at_utc'],str) or not re.fullmatch(
              r'[0-9T:.-]{19,40}\+00:00',doc['observed_at_utc']):
              raise SystemExit('READBACK_TIMESTAMP_DENIED')
          directory=Path('rendezvous/receipts')
          directory.mkdir(parents=True,exist_ok=True)
          fresh=directory/('cc-factory-scope-readback-'+rid+'.json')
          if fresh.exists():
              raise SystemExit('READBACK_RUN_RECEIPT_REPLAY_DENIED')
          data=json.dumps(doc,indent=2,sort_keys=True)+'\n'
          fresh.write_text(data,encoding='utf-8')
          (directory/'cc-factory-scope-readback-current.json').write_text(
              data,encoding='utf-8')
          print('CC_FACTORY_SANITIZED_LIVE_AUDIT_RECEIPT_READY=1')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rendezvous/receipts/cc-factory-scope-readback-*.json
          git diff --cached --quiet && {
            echo "READBACK_NEW_IMMUTABLE_RECEIPT_MISSING"; exit 1;
          }
          git commit -m 'audit: persist scoped Cloudflare factory credential readback'
          git push origin HEAD:main

