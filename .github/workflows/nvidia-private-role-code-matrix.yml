name: NVIDIA Private Five-Task Coding Role Qualification
on:
  push:
    branches: [main]
    paths: ['ops/nvidia_role_code_matrix_trigger.txt']
permissions:
  contents: read
concurrency:
  group: cc-shared-nvidia-private-controlled-provider-test
  cancel-in-progress: false
jobs:
  bounded-role-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: XoticHaze/research-compute-public-
          ref: c91377e009abd1c089abd168fea2d7aa135d71f4
          path: approved-source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify reviewed fixed source, exact selector and 150 behavioral checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C approved-source rev-parse HEAD)" = 'c91377e009abd1c089abd168fea2d7aa135d71f4'
          selector="$(cat ops/nvidia_role_code_matrix_trigger.txt)"
          case "$selector" in
            matrix=poolside|matrix=minimax|matrix=poolside-tail|matrix=minimax-tail) ;;
            *) exit 1 ;;
          esac
          (cd approved-source/cloudflare/shared-nvidia-inference && npm test)
          python -m py_compile scripts/nvidia_role_code_matrix.py
          python -m unittest discover -s tests -p 'test_nvidia_role_code_matrix.py' -v
          node --check approved-source/cloudflare/shared-nvidia-inference/src/index.js
          node --check approved-source/cloudflare/shared-nvidia-inference/local-probe/src/index.js
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const config=JSON.parse(fs.readFileSync('approved-source/cloudflare/shared-nvidia-inference/wrangler.jsonc','utf8'));
          assert.equal(config.name,'cc-shared-nvidia-inference');
          assert.equal(config.workers_dev,false);
          assert.equal(config.preview_urls,false);
          assert.equal(config.vars.CC_NVIDIA_DIAGNOSTIC_ENABLED,'0');
          console.log('NVIDIA_ROLE_FIXED_FICTIONAL_ONLY=PASS');
          JS
      - name: Temporarily enable existing private synthetic-only diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python scripts/nvidia_private_diagnostic_gate_once.py enable
      - name: Ask one model for five distinct public synthetic patches and score 150 hidden checks
        working-directory: approved-source/cloudflare/shared-nvidia-inference
        shell: bash
        run: |
          set -euo pipefail
          selector="$(cat "$GITHUB_WORKSPACE/ops/nvidia_role_code_matrix_trigger.txt")"
          case "$selector" in
            matrix=poolside) python "$GITHUB_WORKSPACE/scripts/nvidia_role_code_matrix.py" poolside all ;;
            matrix=minimax) python "$GITHUB_WORKSPACE/scripts/nvidia_role_code_matrix.py" minimax all ;;
            matrix=poolside-tail) python "$GITHUB_WORKSPACE/scripts/nvidia_role_code_matrix.py" poolside tail ;;
            matrix=minimax-tail) python "$GITHUB_WORKSPACE/scripts/nvidia_role_code_matrix.py" minimax tail ;;
            *) exit 1 ;;
          esac
      - name: Always restore disabled diagnostic and verify original Secrets Store binding
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python scripts/nvidia_private_diagnostic_gate_once.py restore
          echo 'NVIDIA_ROLE_CODE_DIAGNOSTIC_RESTORED=PASS'
