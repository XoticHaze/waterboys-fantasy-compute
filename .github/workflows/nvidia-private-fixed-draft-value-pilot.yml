name: NVIDIA Private Fixed Draft Utility Pilot
on:
  push:
    branches: [main]
    paths: ['ops/nvidia_draft_value_trigger.txt']
permissions:
  contents: read
concurrency:
  group: cc-shared-nvidia-private-controlled-provider-test
  cancel-in-progress: false
jobs:
  fixed-fictional-draft-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: XoticHaze/research-compute-public-
          ref: abd8fcac5299aaf5308e831db6a1fcfcd5066898
          path: approved-source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate pinned source, fictional-only selector and offline tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C approved-source rev-parse HEAD)" = "abd8fcac5299aaf5308e831db6a1fcfcd5066898"
          test "$(cat ops/nvidia_draft_value_trigger.txt)" = 'draft=poolside-fixed-four'
          (cd approved-source/cloudflare/shared-nvidia-inference && npm test)
          python -m py_compile scripts/nvidia_fixed_draft_value_pilot.py
          python -m unittest discover -s tests -p 'test_nvidia_fixed_draft_value_pilot.py' -v
          node --check approved-source/cloudflare/shared-nvidia-inference/src/draft_pilot_runner.js
          node --check approved-source/cloudflare/shared-nvidia-inference/local-probe/src/index.js
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const cfg=JSON.parse(fs.readFileSync('approved-source/cloudflare/shared-nvidia-inference/wrangler.jsonc','utf8'));
          assert.equal(cfg.name,'cc-shared-nvidia-inference');
          assert.equal(cfg.workers_dev,false);
          assert.equal(cfg.preview_urls,false);
          assert.equal(cfg.vars.CC_NVIDIA_DIAGNOSTIC_ENABLED,'0');
          console.log('DRAFT_PILOT_PRIVATE_BOUND_ONLY=PASS');
          JS
      - name: Temporarily enable original private fixed synthetic diagnostic only
        shell: bash
        run: |
          set -euo pipefail
          python scripts/nvidia_private_diagnostic_gate_once.py enable
      - name: Generate and score four fictional drafts versus deterministic templates
        working-directory: approved-source/cloudflare/shared-nvidia-inference
        shell: bash
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/scripts/nvidia_fixed_draft_value_pilot.py"
      - name: Always restore original disabled diagnostic and preserved secret binding
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python scripts/nvidia_private_diagnostic_gate_once.py restore
          echo 'NVIDIA_DRAFT_PILOT_DIAGNOSTIC_RESTORED=PASS'
