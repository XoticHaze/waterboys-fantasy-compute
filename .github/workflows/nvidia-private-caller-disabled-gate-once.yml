name: NVIDIA Private Caller Disabled-Gate Proof (One Shot)

# No deployment and no provider call. The diagnostic target is configured
# disabled; a loopback caller checks remote service-binding connectivity.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nvidia-private-caller-disabled-gate-once.yml'

permissions:
  contents: read

concurrency:
  group: nvidia-private-caller-disabled-gate-once
  cancel-in-progress: false

jobs:
  private-service-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout pinned reviewed private caller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: XoticHaze/research-compute-public-
          ref: 1cd9cdf3839bca98c74d3b75d153bddc1a05543a
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify source and no-public-route configuration
        shell: bash
        working-directory: cloudflare/shared-nvidia-inference
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1cd9cdf3839bca98c74d3b75d153bddc1a05543a"
          npm test
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const c=JSON.parse(fs.readFileSync('local-probe/wrangler.jsonc','utf8'));
          assert.equal(c.name,'cc-shared-nvidia-operator-local-caller');
          assert.equal(c.workers_dev,false);
          assert.equal(c.preview_urls,false);
          assert.deepEqual(c.services,[{
            binding:'NVIDIA_SERVICE',service:'cc-shared-nvidia-inference',remote:true
          }]);
          console.log('PRIVATE_SERVICE_CALLER_CONTRACT=PASS');
          JS
      - name: Verify target binding metadata and disabled diagnostic gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,re
          from urllib.request import Request,urlopen
          a=os.environ['CLOUDFLARE_ACCOUNT_ID'];t=os.environ['CLOUDFLARE_API_TOKEN']
          if re.fullmatch(r'[a-fA-F0-9]{32}',a) is None or not t: raise SystemExit('CLOUDFLARE_AUTH_MISSING')
          def get(n):
              with urlopen(Request('https://api.cloudflare.com/client/v4/accounts/'+a+'/workers/scripts/'+n+'/settings',headers={'Authorization':'Bearer '+t,'Accept':'application/json'}),timeout=15) as r:
                  return json.load(r)
          if get('waterboys-fantasy-broker').get('success') is not True: raise SystemExit('ORDINARY_ACCOUNT_UNPROVEN')
          d=get('cc-shared-nvidia-inference')
          if d.get('success') is not True: raise SystemExit('NVIDIA_WORKER_UNAVAILABLE')
          b=(d.get('result') or {}).get('bindings') or []
          keys=[x for x in b if isinstance(x,dict) and x.get('name')=='NVIDIA_API_KEY']
          vars=[x for x in b if isinstance(x,dict) and x.get('name')=='CC_NVIDIA_DIAGNOSTIC_ENABLED']
          if len(keys)!=1 or keys[0].get('type')!='secrets_store_secret' or keys[0].get('secret_name')!='NVIDIA_API_KEY':
              raise SystemExit('PRIVATE_NVIDIA_BINDING_NOT_APPROVED')
          if len(vars)!=1 or vars[0].get('type')!='plain_text' or vars[0].get('text')!='0':
              raise SystemExit('DIAGNOSTIC_MUST_REMAIN_DISABLED')
          print('NVIDIA_PRIVATE_BINDING_CONFIG_VERIFIED=1')
          print('NVIDIA_DIAGNOSTICS_DISABLED=1')
          PY
      - name: Exercise loopback-only caller against disabled private target
        working-directory: cloudflare/shared-nvidia-inference
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          export CI=true
          npx --yes wrangler@4.135.0 --version >/dev/null
          # Only the ephemeral GitHub runner's LOCAL caller uses an older date.
          # No production config, source commit, or binding is modified.
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('local-probe/wrangler.jsonc')
          doc=json.loads(path.read_text())
          if doc['name']!='cc-shared-nvidia-operator-local-caller' or doc['compatibility_date']!='2026-10-18' or len(doc['services'])!=1 or doc.get('workers_dev') is not False:
              raise SystemExit('UNEXPECTED_PRIVATE_CALLER_CONFIG')
          doc['compatibility_date']='2026-01-01'
          path.write_text(json.dumps(doc,indent=2)+'\\n')
          print('RUNNER_ONLY_WORKERD_COMPATIBILITY_DATE=2026-01-01')
          PY
          npx --yes wrangler@4.135.0 dev --config local-probe/wrangler.jsonc --ip 127.0.0.1 --port 8787 > "$RUNNER_TEMP/nvidia-private-caller-local.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 65); do
            if curl --silent --max-time 2 http://127.0.0.1:8787/ -o /dev/null; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo 'NVIDIA_PRIVATE_CALLER_LOOPBACK=UNAVAILABLE'
            python - <<'PY'
          import os,re
          from pathlib import Path
          data=(Path(os.environ['RUNNER_TEMP'])/'nvidia-private-caller-local.log').read_text(errors='replace').lower()
          patterns={
              'remote_binding_auth':r'permission|forbidden|unauthorized|authentication|access denied|10000|10001',
              'remote_binding_setup':r'service binding|remote binding|cannot connect to|failed to connect to|unsupported',
              'wrangler_config':r'configuration file|invalid config|validation error|wrangler.toml',
              'wrangler_dependency':r'module not found|cannot find package|npm err|econnreset|network timeout',
              'wrangler_interactive_prompt':r'would you like to|press enter|select an account',
              'local_bind':r'eaddrinuse|address already in use|failed to start|listen eacces',
              'wrangler_error_other':r'\[error\]|✘|error:',
          }
          labels=[key for key,pattern in patterns.items() if re.search(pattern,data)]
          print('NVIDIA_PRIVATE_CALLER_START_FAILURE_CLASS=' + (','.join(labels) if labels else 'unclassified'))
          print('NVIDIA_PRIVATE_CALLER_LOG_LINES='+str(len(data.splitlines())))
          # Report only the first selected known failure signature. Never
          # publish Wrangler's raw log, environment variables, or headers.
          signatures={
              'workerd_spawn':r'(?:failed to|cannot|unable to) (?:spawn|start).*workerd|spawn.*workerd',
              'workerd_missing':r'(?:enoent|not found).*workerd|workerd.*(?:enoent|not found)',
              'permission_eprem':r'eperm|operation not permitted',
              'permission_eacces':r'eacces|permission denied',
              'port_collision':r'eaddrinuse|address already in use',
              'invalid_address':r'listen.*(?:eaddrnotavail|einval)|address not available',
              'missing_cloudflare_auth':r'authentication error|invalid api token|missing api token',
              'failed_to_start_workerd':r'failed to start workerd',
              'unknown_bind_error':r'failed to start (?:local server|worker|dev server)',
              'node_exception':r'uncaught exception|unhandled rejection|node:internal',
              'wrangler_bug':r'this is likely a bug in wrangler|internal error',
              'remote_service':r'failed.*(?:remote|service binding)|remote.*(?:unauthorized|forbidden)',
          }
          labels=[name for name,pattern in signatures.items() if re.search(pattern,data)]
          print('NVIDIA_PRIVATE_CALLER_FAILURE_SIGNATURE='+(','.join(labels) if labels else 'no_known_signature'))
          # Only emit the precise workerd failure line with any URL/path/ID
          # removed. Keep all other Wrangler logs private to the runner.
          for line in data.splitlines():
              if 'workerd' not in line and '✘' not in line:
                  continue
              clean=re.sub(r'https?://[^\\s]+','[url]',line)
              clean=re.sub(r'(?i)\\b[a-f0-9]{24,}\\b','[id]',clean)
              clean=re.sub(r'(/[\\w.\\-]+)+','[path]',clean)
              clean=re.sub(r'(?i)(bearer|authorization|secret|token)[=: ]+[^\\s]+','[redacted]',clean)
              print('NVIDIA_PRIVATE_CALLER_SAFE_DIAGNOSTIC='+clean[:180])
              break
          PY
            exit 1
          fi
          curl -sS --max-time 30 -X POST -o "$RUNNER_TEMP/nvidia-private-caller-response.json"             -w '%{http_code}' http://127.0.0.1:8787/run-once > "$RUNNER_TEMP/nvidia-private-caller-http.txt"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          status=(root/'nvidia-private-caller-http.txt').read_text().strip()
          try: payload=json.loads((root/'nvidia-private-caller-response.json').read_text())
          except Exception: raise SystemExit('PRIVATE_CALLER_RECEIPT_INVALID')
          category=payload.get('classification')
          approved={'unexpected_upstream_receipt','remote_service_binding_missing','service_binding_transport_or_receipt_failure'}
          if category not in approved: raise SystemExit('UNEXPECTED_PRIVATE_CALLER_REPLY')
          print('PRIVATE_CALLER_HTTP='+status)
          print('PRIVATE_CALLER_CLASSIFICATION='+category)
          print('PRIVATE_TARGET_DIAGNOSTICS_REMAIN_DISABLED=1')
          print('NVIDIA_PROVIDER_REQUESTS=0')
          if category!='unexpected_upstream_receipt':
              raise SystemExit('PRIVATE_REMOTE_SERVICE_BOUNDARY_NOT_PROVEN')
          PY
